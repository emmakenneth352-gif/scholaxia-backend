<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-attr 'unsafe-inline'; connect-src https://scholaxia1.onrender.com http://127.0.0.1:*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:" />
  <title>Payment — Scholaxia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(160deg, #e8f5ec 0%, #f4faf6 100%);
      color: #1a3d2a;
    }
    .box {
      text-align: center;
      background: #fff;
      border: 1px solid #d4e8da;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(26, 77, 50, 0.08);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #d4e8da;
      border-top-color: #1a5c3a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.1rem; margin: 0 0 8px; }
    p { margin: 0; font-size: 0.9rem; color: #5a6f64; line-height: 1.5; }
    .err { color: #b91c1c; margin-top: 16px; }
    .hidden { display: none; }
    a { color: #1a5c3a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="status-title">Confirming payment…</h1>
    <p id="status-msg">Please wait while we verify your payment with Flutterwave.</p>
    <p class="err hidden" id="status-err"></p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/pnm-launch.js"></script>
  <script src="js/live-payment.js"></script>
  <script src="js/payment-return.js"></script>
</body>
</html>
