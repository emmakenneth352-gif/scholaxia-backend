services:
  - type: web
    name: scholaxia-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholaxia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scholaxia-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

      # Sia AI — DeepSeek (primary) + Gemini/Groq (fallback)
      - key: AI_BACKEND
        value: deepseek
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FLASH_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_MAX_TOKENS
        value: "4096"
      - key: AI_TEMPERATURE
        value: "0.4"

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email OTP — prefer Gmail SMTP for @gmail.com From (inbox, not spam)
      - key: EMAIL_PROVIDER
        value: brevo
      - key: GMAIL_SMTP_EMAIL
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GMAIL_SMTP_NAME
        value: Scholaxia
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_SENDER_EMAIL
        sync: false
      - key: SENDGRID_SENDER_NAME
        value: Scholaxia
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: noreply@scholaxia.com
      - key: BREVO_SENDER_NAME
        value: Scholaxia
      - key: OTP_EXPIRE_MINUTES
        value: "10"

      # Stripe (Payments — add later)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Flutterwave (live class payments)
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
      - key: LIVE_CLASS_JOIN_AMOUNT
        value: "2000"

      # Paystack (library books, CBT packages, class packages)
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false

      # Firebase (Push Notifications) — set FIREBASE_CREDENTIALS_JSON in Render dashboard
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: firebase-credentials.json

      # ElevenLabs (Sia Voice)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2

      # LiveKit (Live Classes — video, audio, screen share)
      - key: LIVEKIT_URL
        value: wss://scholaxia-neyu04kd.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # plugNmeet Cloud (live classes — uses plugNmeet's own classroom client).
      # Values are secrets: set them in the Render dashboard, not in this file.
      - key: PLUGNMEET_URL
        value: https://edge.plugnmeet.cloud
      - key: PLUGNMEET_API_KEY
        sync: false
      - key: PLUGNMEET_API_SECRET
        sync: false
      # Where plugNmeet sends everyone after a meeting is ended/closed.
      - key: PLUGNMEET_LOGOUT_URL
        value: https://scholaxia.com/student.html

      # ALOC CBT past questions (questions.aloc.com.ng)
      - key: ALOC_ACCESS_TOKEN
        sync: false
      - key: ALOC_BASE_URL
        value: https://questions.aloc.com.ng
      - key: ALOC_DEFAULT_YEAR
        sync: false

      # Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: ALLOWED_ORIGINS
        value: '["*"]'

databases:
  - name: scholaxia-db
    databaseName: scholaxia
    user: scholaxia
    plan: free

  - name: scholaxia-redis
    type: redis
    plan: free

  # ── Static site — Sia Web Frontend ──────────────────────────────────────────
  # Deployed separately as a Render Static Site
  # Service name: scholaxia-web
  # Root directory: scholaxia/sia-web
  # Publish directory: . (the sia-web folder itself)
  # No build command needed — pure HTML/CSS/JS

  # Admin website is served from the API itself at:
  #   https://scholaxia1.onrender.com/admin/
  # (static files in static/admin — no separate static service needed)

  # Deprecated separate admin static host — kept disabled intentionally.
  # - type: web
  #   name: scholaxia-admin-dashboard
  #   runtime: static
