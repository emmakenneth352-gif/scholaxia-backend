<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="/app/js/site-guard.js?v=20261112a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Portal — Scholaxia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#0d1b3e; --navy2:#122550; --navy3:#0a1734; --blue:#1a6ef5; --blue2:#0f56d6;
  --sky:#eaf2ff; --ink:#152242; --mut:#5d6b8a; --line:#e3e9f4; --bg:#f4f7fd;
  --ok:#16a34a; --okbg:#e7f8ee; --warn:#d97706; --warnbg:#fdf3e3; --bad:#dc2626; --badbg:#fdeaea;
  --card:#ffffff; --rad:16px; --sh:0 2px 14px rgba(21,34,66,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px}

/* ── LOGIN ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#eef4ff 0%,#dfe9fb 55%,#cddcf7 100%);padding:24px}
.login-wrap{display:grid;grid-template-columns:440px minmax(320px,560px);max-width:1020px;width:100%;background:linear-gradient(160deg,#f6faff 0%,#e8f1fd 100%);border-radius:24px;box-shadow:0 24px 70px rgba(13,27,62,.18);overflow:hidden}
.login-hero{display:flex;align-items:flex-end;justify-content:center;padding:10px 10px 0;background:radial-gradient(120% 90% at 70% 10%,#dcebfe 0%,#c6dcf9 60%,#b3cff5 100%);min-height:560px}
.login-hero img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.login-card{background:transparent;border-radius:0;box-shadow:none;max-width:none;width:100%;padding:44px 42px}
@media(max-width:860px){.login-wrap{grid-template-columns:1fr}.login-hero{display:none}.login-card{padding:34px 26px}}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-brand img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--sky)}
.login-brand .fallback-logo{width:52px;height:52px;border-radius:12px;background:var(--navy);color:#f7c948;display:flex;align-items:center;justify-content:center;font-size:26px}
.login-brand h1{font-size:20px;font-weight:800;color:var(--navy);line-height:1.15}
.login-brand small{color:var(--mut);font-size:12px}
.login-card h2{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:6px}
.login-card .sub{color:var(--mut);margin-bottom:24px;line-height:1.45}
.f-label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px;color:var(--navy)}
.f-in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;outline:none;background:#fbfcff;transition:border .15s}
.f-in:focus{border-color:var(--blue);background:#fff}
textarea.f-in{resize:vertical;min-height:60px}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px;font-size:13.5px;color:var(--mut)}
.btn-login{width:100%;padding:13px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;transition:background .15s}
.btn-login:hover{background:var(--blue2)}
.btn-login[disabled]{opacity:.65;cursor:wait}
.login-err{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:13.5px}
.login-foot{margin-top:20px;text-align:center;color:#9aa7c2;font-size:12.5px}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,var(--navy3) 100%);color:#cfd9ee;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .blogo{width:44px;height:44px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.brand .blogo img{width:100%;height:100%;object-fit:cover}
.brand .blogo span{font-size:22px}
.brand h3{color:#fff;font-size:15.5px;font-weight:700;line-height:1.2}
.brand small{color:#8fa3c8;font-size:11px}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#c2cee6;padding:11px 13px;border-radius:10px;font-size:14.5px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--blue);color:#fff;font-weight:600}
.nav .ico{width:20px;text-align:center;flex:none}
.nav-sec{margin:16px 6px 3px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#7f93b8;font-weight:700}
.nav-sec:first-child{margin-top:2px}
.step{display:flex;gap:13px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.step:last-child{border-bottom:0}
.step:hover{background:#f6f9ff}
.step-n{width:27px;height:27px;border-radius:50%;background:#e8f0fe;color:#1d4ed8;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.steps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:4px}
@media(max-width:1180px){.steps-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.steps-grid{grid-template-columns:1fr}}
.step-card{position:relative;overflow:hidden;border:1px solid #dbe6fb;border-radius:16px;padding:16px 16px 15px;cursor:pointer;background:linear-gradient(155deg,#ffffff 0%,#f3f8ff 100%);transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease}
.step-card:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(37,99,235,.15);border-color:#a9c9ff}
.step-card:before{content:"";position:absolute;width:120px;height:120px;right:-46px;top:-56px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.22),rgba(37,99,235,0) 70%)}
.step-card .num{width:31px;height:31px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#5aa2ff);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 6px 14px rgba(37,99,235,.32);position:relative}
.step-card h4{margin:0 0 5px;font-size:14.5px;color:#0f1c33;position:relative}
.step-card p{margin:0;font-size:12.4px;line-height:1.45;color:#64748b;position:relative}
.step-card .go{position:absolute;right:14px;bottom:12px;color:#2563eb;font-weight:700;font-size:12.5px}
.side-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#8fa3c8;line-height:1.6}
/* Quick Stats (reference sidebar) */
.qstats{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.09);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qstats .qs{color:#8fa3c8;font-size:11px;line-height:1.3}
.qstats .qs b{display:block;color:#fff;font-size:17px;font-weight:800;margin-top:2px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.topbar .search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 14px;color:var(--mut)}
.topbar .search input{border:none;background:none;outline:none;flex:1;color:var(--ink)}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.who .nm{font-weight:700;font-size:14px;line-height:1.1}
.who .rl{color:var(--mut);font-size:12px}
.content{padding:26px;max-width:1200px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;color:var(--navy)}
.page-head p{color:var(--mut);margin-top:3px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:none;border-radius:11px;background:var(--blue);color:#fff;font-weight:600;font-size:14.5px}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.green{background:var(--ok)}.btn.green:hover{background:#128a3e}
.btn.red{background:var(--bad)}.btn.red:hover{background:#b91c1c}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.6;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:18px}
.card .cl{display:flex;gap:12px;align-items:center}
.card .cico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.card .clab{color:var(--mut);font-size:13px}
.card .cval{font-size:26px;font-weight:800;color:var(--navy)}
.panel{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:20px;margin-bottom:20px}
.panel h3{font-size:16.5px;margin-bottom:14px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.blue{background:var(--sky);color:var(--blue)}
.pill.gray{background:#eef1f7;color:var(--mut)}
.pill.violet{background:#f3e8ff;color:#7c3aed}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-grid .full{grid-column:1/-1}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.muted{color:var(--mut)}
.stat-mini{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--sky);color:var(--blue);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600}
.chip.g{background:var(--okbg);color:var(--ok)}.chip.w{background:var(--warnbg);color:var(--warn)}.chip.r{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:none;padding:11px 16px;font-size:14px;font-weight:600;color:var(--mut);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;cursor:pointer;background:#fbfcff}
#toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:999;box-shadow:0 10px 30px rgba(13,27,62,.3);max-width:420px}
/* ═══ MOBILE RESPONSIVENESS ═══ */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:60;width:250px;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .sidebar-open::before{content:"";position:fixed;inset:0;background:rgba(13,27,62,.45);z-index:55}
  .content{padding:16px 12px}
  .topbar{padding:10px 12px;gap:8px}
  .topbar .search{padding:8px 12px}
  .who .nm,.who .rl{display:none}
}
@media(max-width:720px){
  body{font-size:14.5px}
  .content{padding:12px 10px}
  .page-head h1{font-size:21px}
  .page-head p{font-size:13px}
  .cards{gap:10px}
  .card{padding:14px}
  .card .cval{font-size:21px}
  .panel{padding:14px;border-radius:14px}
  /* Tabs (incl. Exams sub-tabs) — swipeable pill row instead of clipped underline tabs */
  .tabs{display:flex;gap:7px;border-bottom:none;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:8px 14px;font-size:13px;margin-bottom:0}
  .tabs button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
  /* Form grids collapse to one column */
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
  /* Tables: keep data readable without horizontal pinch-zoom */
  table{font-size:13px}
  th,td{padding:9px 8px}
  td{white-space:normal}
  td code{font-size:12px;word-break:break-all}
  td[style*="white-space:nowrap"]{white-space:normal!important}
  td[style*="white-space:nowrap"] .btn{margin:2px 0}
  td .btn.sm{padding:6px 10px;font-size:12px}
  .stat-mini{gap:6px}
  .chip{padding:5px 11px;font-size:11.5px}
  .radio-row label{padding:8px 10px;font-size:12.5px}
  /* Modals become full-width sheets */
  .mb-back{padding:0;align-items:flex-end}
  .mb-modal{max-height:94vh;border-radius:18px 18px 0 0}
  .mb-modal.wide{max-width:100%}
  .mb-body{padding:14px 16px}
  .mb-head{padding:14px 16px 0}
  .mb-foot{padding:12px 16px 14px;flex-wrap:wrap}
  .mb-foot .btn{flex:1;justify-content:center}
  .mb-foot .btn + .btn{margin-left:0}
  .qrow .opts{grid-template-columns:1fr}
}
@media(max-width:480px){
  .content{padding:10px 8px}
  .panel{padding:12px}
  .btn{padding:10px 14px;font-size:13.5px}
  .btn.sm{padding:6px 10px;font-size:12px}
  .page-head h1{font-size:19px}
  .card .cval{font-size:19px}
  .topbar .search{max-width:none}
}

/* ═══ MOBILE NAV (hamburger for the sidebar) ═══ */
.mob-menu-btn{display:none;background:#fff;border:1.5px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:19px;color:var(--navy);flex:none;align-items:center;justify-content:center}
@media(max-width:900px){
  .mob-menu-btn{display:flex}
  .topbar .search{flex:1}
}
@media(max-width:560px){
  .topbar .search{display:none}
}
@media print{.sidebar,.topbar,#toast{display:none!important}.content{padding:0}}

/* ── MODALS ── */
.mb-back{position:fixed;inset:0;background:rgba(13,27,62,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:500;padding:18px}
.mb-modal{background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(13,27,62,.35);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:mbin .16s ease-out}
.mb-modal.wide{max-width:760px}
@keyframes mbin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.mb-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.mb-head h3{font-size:18px;color:var(--navy);font-weight:800}
.mb-x{background:#f1f4fa;border:none;border-radius:9px;width:32px;height:32px;font-size:14px;color:var(--mut)}
.mb-x:hover{background:#e6ebf5;color:var(--ink)}
.mb-body{padding:16px 22px;overflow-y:auto}
.mb-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.mrow{margin-bottom:13px}
.mrow .f-label{margin:0 0 5px}
.mhint{font-size:12.5px;color:var(--mut);margin-top:4px}
.merr{display:none;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:13px}
.mnote{background:var(--okbg);border:1px solid #bfe8cf;color:#116a35;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6}
.mnote code{background:#fff;border:1px solid #bfe8cf;border-radius:6px;padding:2px 7px;font-size:13px;font-weight:700}
.qrow{border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:#fbfcff}
/* Exams & CBT — local sidebar (each function its own tab, reference UI) */
.exside-wrap{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.exside{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:12px;position:sticky;top:86px}
.exside button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink)}
.exside button:hover{background:var(--sky)}
.exside button.on{background:var(--blue);color:#fff;font-weight:600}
.exside-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:6px 12px 4px}
.exmain{min-width:0}
@media(max-width:900px){
  .exside-wrap{grid-template-columns:1fr;gap:12px}
  .exside{position:static;display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px;scrollbar-width:none}
  .exside::-webkit-scrollbar{display:none}
  .exside button{white-space:nowrap;width:auto;flex:none;border:1.5px solid var(--line);background:#fff}
  .exside button.on{border-color:var(--blue);background:var(--blue)}
  .exside-label{display:none}
}
/* Upload Results: one flex row per student (wraps on small screens) */  .up-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .rg3{grid-template-columns:1fr 1fr 1fr}
  .rg2{grid-template-columns:1fr 1fr}
  @media(max-width:860px){.rg3,.rg2{grid-template-columns:1fr}}
.up-row .f-in{flex:1;min-width:150px}
.up-row input[type=number]{flex:0 0 90px;min-width:90px}
.qrow .qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qrow .qtop b{font-size:13px;color:var(--blue)}
.qrow .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.qrow .opt{display:flex;align-items:center;gap:8px}
.qrow .opt b{font-size:12.5px;color:var(--mut);width:16px}
.doc-pill{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--blue);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;text-decoration:none}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login">
  <div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="blogo" id="lgLogoWrap"><span>🎓</span></div>
      <div><h1 id="lgSchool">School Portal</h1><small>Scholaxia School Platform</small></div>
    </div>
    <h2>Welcome back!</h2>
    <p class="sub">Log in to your school account and manage students, exams, results and more.</p>
    <form id="loginForm">
      <label class="f-label" for="lgId">Email or phone number</label>
      <input class="f-in" id="lgId" autocomplete="username" placeholder="admin@yourschool.com" required />
      <label class="f-label" for="lgPw">Password</label>
      <input class="f-in" id="lgPw" type="password" autocomplete="current-password" placeholder="Enter your password" required />
      <div class="login-row"><label><input type="checkbox" checked style="accent-color:var(--blue)" /> Remember me</label><a href="#" onclick="return fpOpen()" style="color:var(--blue);text-decoration:none">Forgot password?</a></div>
      <button class="btn-login" id="lgBtn" type="submit">→&nbsp; Log In</button>
      <div class="login-err" id="lgErr"></div>
    </form>
    <p class="login-foot">Powered by Scholaxia · <span id="lgLink"></span></p>
  </div>
  <div class="login-hero"><img src="media/portal-login-hero.png" alt="" /></div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="blogo" id="sbLogoWrap"><span>🎓</span></div>
        <div><h3 id="sbSchool">School</h3><small id="sbTag">Scholaxia School Platform</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="qstats" id="quickStats" style="display:none"></div>
      <div class="side-foot">Better learning today,<br/>brighter futures tomorrow.<br/><span id="sbUser" style="color:#c2cee6"></span></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="mob-menu-btn" onclick="toggleMobNav()" aria-label="Open menu">☰</button>
        <div class="search">🔍 <input id="gSearch" placeholder="Search students… (press Enter)" /></div>
        <div class="who"><div class="avatar" id="uAvatar">A</div><div><div class="nm" id="uName">—</div><div class="rl" id="uRole">School Admin</div></div>
          <button class="btn sm ghost" onclick="showHelp()" style="margin-left:8px" title="How this portal works">❓ Help</button>
          <button class="btn sm ghost" onclick="logout()" style="margin-left:6px">Log out</button></div>
      </div>
      <div class="content" id="pages"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ═══════════ School Portal SPA ═══════════
   Slug comes from the host (<slug>.scholaxia.com), custom-domain lookup,
   or /school/<slug>/ path. */
(function () {
  var slug = (function () {
    try {
      var q = new URLSearchParams(location.search).get("school");
      if (q) return q.toLowerCase().replace(/[^a-z0-9-]/g, "");
      var h = location.hostname.toLowerCase();
      if (h.endsWith(".scholaxia.com") && h !== "scholaxia.com" && h !== "www.scholaxia.com") return h.split(".")[0];
      var m = location.pathname.match(/\/school\/([a-z0-9-]+)/i);
      if (m) return m[1].toLowerCase();
    } catch (e) {}
    return "";
  })();

  if (!slug && !["scholaxia.com", "www.scholaxia.com", "scholaxia1.onrender.com"].includes(location.hostname.toLowerCase())) {
    fetch(location.origin + "/api/v1/public/schools/resolve-host?host=" + encodeURIComponent(location.hostname))
      .then(function (r) {
        if (!r.ok) throw new Error("Could not resolve this school's domain.");
        return r.json();
      })
      .then(function (d) {
        if (!d.school || !d.school.slug) throw new Error("This domain is not connected to a school yet.");
        var target = new URL(location.href);
        target.searchParams.set("school", d.school.slug);
        location.replace(target.toString());
      })
      .catch(function (e) {
        console.error("Could not resolve school domain", e);
        document.title = "School portal unavailable — Scholaxia";
        var main = document.createElement("main");
        main.style.cssText = "max-width:640px;margin:12vh auto;padding:24px;font:16px system-ui;text-align:center";
        var heading = document.createElement("h1");
        heading.textContent = "School portal unavailable";
        var message = document.createElement("p");
        message.textContent = e.message || "This domain is not connected to a school yet.";
        main.appendChild(heading);
        main.appendChild(message);
        document.body.replaceChildren(main);
      });
    return;
  }

  var API = "https://scholaxia1.onrender.com/api/v1";
  if (!["scholaxia.com", "www.scholaxia.com"].includes(location.hostname.toLowerCase())) {
    API = location.origin + "/api/v1";
  }

  var S = { school: null, user: null, token: localStorage.getItem("sx_portal_token_" + slug) || null, pin: null, cache: {} };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return "₦" + Number(n || 0).toLocaleString("en-NG"); };

  function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 3000); }

  /* Friendly error text — never "[object Object]" */
  function errText(e) {
    if (e == null) return "Something went wrong";
    if (typeof e === "string") return e;
    var raw = e.message != null ? e.message : null;
    if (raw != null) {
      var s = String(raw);
      if (s === "[object Object]" || s === "[object Undefined]") { try { s = JSON.stringify(e); } catch (_) { s = ""; } }
      try {
        var arr = JSON.parse(s);
        if (Array.isArray(arr)) {
          return arr.map(function (v) { return (v && v.msg ? v.msg : "") + (v && v.loc && v.loc.length ? " (" + v.loc.join(".") + ")" : ""); }).filter(Boolean).join("; ") || "Invalid input";
        }
      } catch (_) {}
      if (s.indexOf("[object") === 0) { try { s = JSON.stringify(e); } catch (_) {} }
      return s || "Something went wrong";
    }
    try { return JSON.stringify(e); } catch (_) { return "Something went wrong"; }
  }
  function detailOf(d) {
    if (!d) return null;
    var det = d.detail != null ? d.detail : (d.message != null ? d.message : null);
    if (det == null) return null;
    if (typeof det === "string") return det;
    if (Array.isArray(det)) return det.map(function (v) { return v && v.msg ? v.msg + (v.loc ? " (" + v.loc.join(".") + ")" : "") : ""; }).filter(Boolean).join("; ") || "Invalid input";
    try { return det.msg || JSON.stringify(det); } catch (_) { return "Request failed"; }
  }
  function toastErr(e) { toast("⚠️ " + errText(e)); }

  /* Every network call goes through here, so a slow or dead server can never
     leave a button spinning forever — it gives up with a readable message. */
  function sxFetch(url, opts, ms) {
    opts = opts || {};
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = null;
    var req;
    try { req = fetch(url, ctrl ? Object.assign({}, opts, { signal: ctrl.signal }) : opts); }
    catch (e) { return Promise.reject(e); }
    if (!ctrl) return req;
    return Promise.race([
      req,
      new Promise(function (_, reject) {
        timer = setTimeout(function () {
          try { ctrl.abort(); } catch (_) {}
          reject(new Error("The server took too long to answer. Check your connection and try again."));
        }, ms || 60000);
      })
    ]).then(function (r) { clearTimeout(timer); return r; },
            function (e) { clearTimeout(timer); throw e; });
  }
  function _headers(json) {
    var h = {};
    if (json !== false) h["Content-Type"] = "application/json";
    if (S.token) h["Authorization"] = "Bearer " + S.token;
    if (S.pin) h["X-School-Pin"] = S.pin;
    return h;
  }
  function _handle(r) {
    return r.text().then(function (txt) {
      var d = null;
      try { d = txt ? JSON.parse(txt) : null; } catch (_) { d = null; }
      if (r.status === 401 && S.token) { logout(); throw new Error("Session expired — log in again."); }
      if (!r.ok) {
        var det = detailOf(d);
        if (String(det || "").indexOf("PIN_REQUIRED") >= 0) {
          S.pin = null;
          throw new Error("Admin PIN required — ask your school admin for access.");
        }
        throw new Error(det || ("Request failed (" + r.status + ")"));
      }
      return d;
    });
  }
  function api(path, opts) {
    opts = opts || {};
    var method = String(opts.method || "GET").toUpperCase();
    var run = function () {
      return sxFetch(API + "/school-portal/" + slug + path, {
        method: method,
        headers: _headers(!opts.form),
        body: opts.form ? opts.form : (opts.body ? JSON.stringify(opts.body) : undefined),
      }).then(_handle);
    };
    var guarded = PIN_METHODS.indexOf(method) >= 0 || (method === "POST" && /(delete|clear|restrict|remove|publish|\/review)/i.test(path));
    return guarded ? withAdminPin(run) : run();
  }
  function officeApi(path, opts) {
    opts = opts || {};
    var method = String(opts.method || "GET").toUpperCase();
    var run = function () {
      return sxFetch(API + "/admin/school-office" + path, {
        method: method,
        headers: _headers(!opts.form),
        body: opts.form ? opts.form : (opts.body ? JSON.stringify(opts.body) : undefined),
      }).then(_handle);
    };
    return PIN_METHODS.indexOf(method) >= 0 ? withAdminPin(run) : run();
  }

  /* ── MODAL SYSTEM (replaces every prompt/alert/confirm) ── */
  window.closeModal = function () { var b = $("mb"); if (b) b.remove(); };
  function settingsApi(path, opts) {
    opts = opts || {};
    var sid = (S.user && S.user.school_id) || null;
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    var method = String(opts.method || "GET").toUpperCase();
    var run = function () {
      return sxFetch(API + "/school-settings" + path + (sid ? sep + "school_id=" + sid : ""), {
        method: method,
        headers: _headers(!opts.form),
        body: opts.form ? opts.form : (opts.body ? JSON.stringify(opts.body) : undefined),
      }).then(_handle);
    };
    // The PIN endpoints themselves never ask for the PIN first.
    if (path.indexOf("/pin") === 0) return run();
    return PIN_METHODS.indexOf(method) >= 0 ? withAdminPin(run) : run();
  }

  function openModal(title, bodyHTML, footHTML, wide) {
    closeModal();
    var b = document.createElement("div"); b.id = "mb"; b.className = "mb-back";
    b.innerHTML = '<div class="mb-modal' + (wide ? " wide" : "") + '" role="dialog" aria-modal="true">' +
      '<div class="mb-head"><h3>' + title + '</h3><button class="mb-x" onclick="closeModal()" aria-label="Close">✕</button></div>' +
      '<div class="mb-body">' + bodyHTML + '</div>' +
      (footHTML ? '<div class="mb-foot">' + footHTML + '</div>' : '') + '</div>';
    b.addEventListener("mousedown", function (e) { if (e.target === b) closeModal(); });
    document.body.appendChild(b);
    var f = b.querySelector("input,select,textarea,button.btn"); if (f) f.focus();
    return b;
  }
  function mErr(msg) {
    var box = document.querySelector("#mb .merr"); if (!box) return;
    box.textContent = msg; box.style.display = "block";
  }
  function busy(btn, on, label) {
    if (!btn) return;
    btn.disabled = !!on;
    btn.innerHTML = on ? '<span class="spin"></span> Working…' : label;
  }
  window.confirmModal = function (title, msg, onYes, yesLabel, red) {
    openModal(esc(title), '<p style="font-size:14.5px;line-height:1.6">' + msg + '</p><div class="merr" style="display:none;margin-top:10px"></div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ' + (red ? "red" : "") + '" id="cfYes">' + (yesLabel || "Confirm") + '</button>');
    $("cfYes").addEventListener("click", function () { onYes($("cfYes")); });
  };

  /* ── LOGIN SCREEN ── */
  function initLogin() {
    if (!slug) { $("lgSchool").textContent = "School Portal"; return; }
    sxFetch(API + "/school-portal/" + slug + "/public").then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.name) return;
      S.school = d;
      $("lgSchool").textContent = d.name;
      document.title = d.name + " — Portal";
      $("lgLink").textContent = (d.school_type ? d.school_type.charAt(0).toUpperCase() + d.school_type.slice(1) : "") + (d.category && d.category !== "mixed" ? " · " + d.category.charAt(0).toUpperCase() + d.category.slice(1) + " only" : "");
      setLogo($("lgLogoWrap"), d.logo_url);
    }).catch(function () {});
    if (S.token) { tryEnter(); }
  }
  function setLogo(wrapEl, url) {
    if (!url) return;
    wrapEl.innerHTML = '<img src="' + esc(url) + '" alt="logo" onerror="this.parentNode.innerHTML=\'<span>🎓</span>\'" />';
  }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("lgBtn"), err = $("lgErr");
    err.style.display = "none";
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Logging in…';
    sxFetch(API + "/school-portal/" + slug + "/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifier: $("lgId").value.trim(), password: $("lgPw").value }),
    }).then(_handle).then(function (d) {
      // School admin and school teachers land on the SAME portal. What they can
      // save or delete is decided by the admin PIN, not by a different page.
      S.token = d.access_token; S.user = d.user; S.school = d.school;
      localStorage.setItem("sx_portal_token_" + slug, S.token);
      localStorage.setItem("sx_portal_user_" + slug, JSON.stringify(d.user));
      enter();
    }).catch(function (ex) {
      err.textContent = errText(ex) || "Could not log in"; err.style.display = "block";
      btn.disabled = false; btn.innerHTML = "→&nbsp; Log In";
    });
  });
  /* ── Forgot password (the link used to be dead): OTP reset via
     /auth/otp/send (purpose=reset_password) + /auth/password/reset.
     Works for the school admin account the portal logs in with. ── */
  window.fpOpen = function () {
    openModal("Reset your password",
      '<p class="mhint">Enter the email this school was registered with. We email you a code, then you set a new password.</p>' +
      '<div style="margin-top:12px"><label class="f-label">Email *</label><input class="f-in" id="fpEmail" type="email" placeholder="admin@yourschool.com" /></div>' +
      '<div class="merr" style="display:none;margin-top:10px"></div>',
      '<button class="btn green" id="fpSend">📧 Send code</button>');
    $("fpSend").addEventListener("click", fpSend);
    return false;
  };
  function fpSend() {
    var email = ($("fpEmail").value || "").trim();
    if (!email) return mErr("Enter the email the school was registered with.");
    busy($("fpSend"), true, "Send code");
    sxFetch(API + "/auth/otp/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, purpose: "reset_password" }),
    }).then(_handle).then(function (d) {
      fpStep2(email, d && d.debug_otp ? String(d.debug_otp) : null);
    }).catch(function (ex) {
      busy($("fpSend"), false, "📧 Send code");
      mErr(errText(ex) || "Could not send the code right now.");
    });
  }
  function fpStep2(email, debugOtp) {
    openModal("Reset your password",
      '<p class="mhint">We sent a code to <strong>' + esc(email) + '</strong>.' +
      (debugOtp ? ' (Dev code: <code>' + esc(debugOtp) + '</code>)' : ' Check the inbox (and spam).') + '</p>' +
      '<div style="margin-top:12px"><label class="f-label">Code from email *</label><input class="f-in" id="fpOtp" inputmode="numeric" maxlength="10" placeholder="123456" /></div>' +
      '<div style="margin-top:10px"><label class="f-label">New password *</label><input class="f-in" id="fpPw" type="password" minlength="8" placeholder="At least 8 characters" /></div>' +
      '<div class="merr" style="display:none;margin-top:10px"></div>',
      '<button class="btn green" id="fpGo">✅ Set new password</button>');
    $("fpGo").addEventListener("click", function () {
      var otp = ($("fpOtp").value || "").trim();
      var pw = $("fpPw").value || "";
      if (!otp) return mErr("Enter the code from the email.");
      if (pw.length < 8) return mErr("New password must be at least 8 characters.");
      busy($("fpGo"), true, "Set new password");
      sxFetch(API + "/auth/password/reset", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, otp: otp, new_password: pw }),
      }).then(_handle).then(function () {
        closeModal();
        $("lgId").value = email;
        $("lgPw").value = "";
        toast("✅ Password updated — log in with your new password.");
      }).catch(function (ex) {
        busy($("fpGo"), false, "✅ Set new password");
        mErr(errText(ex) || "Could not reset the password.");
      });
    });
  }
  function logout() {
    localStorage.removeItem("sx_portal_token_" + slug);
    localStorage.removeItem("sx_portal_user_" + slug);
    location.reload();
  }
  window.logout = logout;
  function tryEnter() {
    var u = localStorage.getItem("sx_portal_user_" + slug);
    if (u) { try { S.user = JSON.parse(u); enter(); return; } catch (e) {} }
    logout();
  }

  /* ── APP SHELL ──
     Grouped by what you are trying to do, so the 18 pages read as five short
     sections instead of one long list. */
  var PAGES = [
    ["dashboard", "🏠", "Dashboard"],
    ["students", "👥", "Students"], ["teachers", "👨‍🏫", "Teachers"],
    ["lessonhub", "🗒️", "Notes & Materials"],
    ["classes", "🎓", "Classes"],
    ["attendance", "📋", "Attendance"], ["fees", "💳", "Fees & Payments"],
    ["exreg", "🧾", "Register Student"], ["exstudents", "✅", "Approve Students"],
    ["exsched", "🗓️", "Exam Schedule"], ["exbank", "🏦", "Upload Exams"],
    ["exresults", "🏆", "Exam Results"], ["exretake", "🔄", "Grant Retake"],
    ["exup", "📤", "Upload Results"], ["exreview", "🔍", "Result Review"],
    ["extpl", "🖨️", "Report Card Design"],
    ["results", "📊", "Result Book"], ["reports", "📈", "Reports"],
    ["settings", "⚙️", "Settings"],
  ];
  var NAV_SECTIONS = {
    dashboard: "Overview",
    students: "School", teachers: "School", lessonhub: "School", classes: "School",
    attendance: "School", fees: "School",
    exreg: "Exams", exstudents: "Exams", exsched: "Exams", exbank: "Exams",
    exresults: "Exams", exretake: "Exams",
    exup: "Results", exreview: "Results", extpl: "Results", results: "Results", reports: "Results",
    settings: "Setup",
  };
  /* ── FEATURES THE SCHOOL SWITCHED OFF FOR TEACHERS ──
     Same locks as Settings → "What your teachers can use". A teacher who opens
     a locked section gets "Ask your school admin for access" instead of the
     page; the admin is never blocked. */
  // Each lock in Settings matches one section of THIS portal.
  var PAGE_LOCK_OVERRIDE = { lessonhub: "portal.notes" };
  function lockKeyFor(page) { return PAGE_LOCK_OVERRIDE[page] || ("portal." + page); }
  var TEACHER_LOCKS = null;
  var TEACHER_LOCKS_AT = 0;

  function isTeacherRole() {
    return String((S.user && S.user.role) || "").toLowerCase() === "teacher";
  }
  function lockedMessage(page) {
    if (!isTeacherRole() || !TEACHER_LOCKS) return null;
    if (page === "dashboard") return null;
    var lock = TEACHER_LOCKS[lockKeyFor(page)];
    if (!lock) return null;
    return lock.message || "Ask your school admin for access.";
  }
  function loadTeacherLocksForNav(force) {
    if (!isTeacherRole()) return Promise.resolve();
    if (!force && TEACHER_LOCKS && (Date.now() - TEACHER_LOCKS_AT) < 30000) {
      return Promise.resolve(TEACHER_LOCKS);
    }
    return settingsApi("/features").then(function (d) {
      var map = {};
      (d && d.features || []).forEach(function (f) { if (f.locked) map[f.key] = f; });
      TEACHER_LOCKS = map;
      TEACHER_LOCKS_AT = Date.now();
      markLockedNav();
      return map;
    }).catch(function () { TEACHER_LOCKS = TEACHER_LOCKS || {}; return TEACHER_LOCKS; });
  }
  function markLockedNav() {
    Array.prototype.forEach.call(document.querySelectorAll(".nav button"), function (b) {
      var page = b.getAttribute("data-p");
      if (!lockedMessage(page)) return;
      b.style.opacity = ".62";
      b.title = "Ask your school admin for access";
      if (!b.querySelector(".lk")) {
        var lock = document.createElement("span");
        lock.className = "lk";
        lock.textContent = "🔒";
        lock.style.marginLeft = "auto";
        lock.style.fontSize = "12px";
        b.appendChild(lock);
      }
    });
  }
  function showLockedPage(page) {
    var title = "";
    PAGES.forEach(function (p) { if (p[0] === page) title = p[2]; });
    $("pages").innerHTML = head(title || "Locked", "This part is switched off for teachers.") +
      '<div class="panel"><div class="empty">🔒 <strong>Ask your school admin for access.</strong>' +
      (lockedMessage(page) && lockedMessage(page) !== "Ask your school admin for access."
        ? '<br/>' + esc(lockedMessage(page)) : "") + '</div></div>';
  }
  window.refreshTeacherLocks = function () { return loadTeacherLocksForNav(true); };

  /* ── ADMIN PIN ──
     Teachers and the school admin share this portal. Read screens are open to
     both; changing or deleting school data asks for the 6-digit admin PIN,
     which only the school admin knows. */
  function enter() { enterApp(); }

  var PIN_METHODS = ["DELETE", "PATCH", "PUT"];

  function requestAdminPin() {
    return new Promise(function (resolve) {
      openModal("Admin PIN needed",
        '<p class="mhint">Changing or deleting school data needs the 6-digit admin PIN. Teachers do not have it — ask your school admin for access.</p>' +
        '<div class="mrow" style="margin-top:14px"><label class="f-label">Admin PIN</label>' +
        '<input class="f-in" id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" style="letter-spacing:.45em;font-size:20px;text-align:center" /></div>' +
        '<div class="merr" style="display:none;margin-top:8px"></div>',
        '<button class="btn ghost" id="pinCancel">Cancel</button><button class="btn" id="pinGo">Confirm</button>');
      var inp = $("pinInput");
      setTimeout(function () { if (inp) inp.focus(); }, 60);
      var settled = false;
      function done(ok) { if (settled) return; settled = true; closeModal(); resolve(ok); }
      $("pinCancel").addEventListener("click", function () { done(false); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") $("pinGo").click(); });
      $("pinGo").addEventListener("click", function () {
        var v = (inp.value || "").trim();
        if (!/^\d{6}$/.test(v)) return mErr("Enter the 6-digit PIN.");
        busy($("pinGo"), true);
        settingsApi("/pin/verify", { method: "POST", body: { pin: v } }).then(function (d) {
          if (!d || !d.ok) { busy($("pinGo"), false, "Confirm"); return mErr("Wrong PIN. Ask your school admin."); }
          S.pin = v;
          done(true);
        }).catch(function (e) { busy($("pinGo"), false, "Confirm"); mErr(errText(e)); });
      });
    });
  }

  function withAdminPin(run) {
    if (S.pin) return run();
    return requestAdminPin().then(function (ok) {
      if (!ok) throw new Error("Admin PIN required");
      return run();
    });
  }

  window.pinCreate = function () {
    openModal("Create the admin PIN",
      '<p class="mhint">Choose a 6-digit PIN. It is asked before anyone changes or deletes school data, so only you and the people you trust can do it. Keep it private — teachers do not get it.</p>' +
      '<div class="mrow" style="margin-top:14px"><label class="f-label">New 6-digit PIN</label>' +
      '<input class="f-in" id="pinNew" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" style="letter-spacing:.45em;font-size:20px;text-align:center" /></div>' +
      '<div class="mrow"><label class="f-label">Repeat PIN</label>' +
      '<input class="f-in" id="pinNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" style="letter-spacing:.45em;font-size:20px;text-align:center" /></div>' +
      '<div class="merr" style="display:none;margin-top:8px"></div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="pinSave">Create PIN</button>');
    setTimeout(function () { if ($("pinNew")) $("pinNew").focus(); }, 60);
    $("pinSave").addEventListener("click", function () {

  /* ═══ EXAMS & CBT — full CBT engine (reference admin-dashboard pattern) ═══ */
  var CB = ""; // api base for the school-CBT engine
  function cbtApi(path, opts) {
    opts = opts || {};
    var sid = (S.user && S.user.school_id) || null;
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    var method = String(opts.method || "GET").toUpperCase();
    var run = function () {
      return sxFetch(API + "/school-cbt" + path + (sid ? sep + "school_id=" + sid : ""), {
        method: method,
        headers: _headers(!opts.form),
        body: opts.form ? opts.form : (opts.body ? JSON.stringify(opts.body) : undefined),
      }).then(_handle);
    };
    // Deleting, clearing, restricting or publishing anything asks for the PIN.
    var destructive = PIN_METHODS.indexOf(method) >= 0 || (method === "POST" && /(delete|clear|restrict|remove|publish|\/review)/i.test(path));
    return destructive ? withAdminPin(run) : run();
  }

     exactly like the reference dashboard (Register Student, Exam Students,

  // they were typed. Compare on the space/case-free key so a bank uploaded
  // as "JSS 1" is still auto-selected for an exam typed as "JSS1".
  function clsKey(v) {
    return String(v || "").toUpperCase().replace(/\s+/g, "");

    ["exretake", "Grant Retake", "Fetch a student by reg number and grant their retake", ""],
    ["exup", "Upload Results", "Pick a class and your subject — the class roll fills in automatically, then save or send your scores to the admin", ""],
    ["exreview", "Result Review", "Scores teachers sent in — check them, then publish before report cards are prepared", ""],

      if (UQ.step === 1) {
        body += '<div class="uq-sec"><span class="n">1</span>School level</div>';
        body += UQ.levels.length ? '<div class="uq-cards">' + UQ.levels.map(function (l) {
          return '<div class="uq-card' + (UQ.level === l.id ? " on" : "") + '" data-lvl="' + l.id + '"><b>' + esc(l.label) + '</b><span>' + esc(shortRange(l.classes || [])) + '</span></div>';
        }).join("") + '</div>' : '<div class="empty">Loading school levels…</div>';
      }
      if (UQ.step === 2) {
        var lo = lvlObj();
        body += '<div class="uq-sec"><span class="n">2</span>Class — ' + esc(lo ? lo.label : "") + '</div>';
        body += '<div class="uq-grid">' + (lo ? lo.classes.map(function (c) {
          return '<button class="uq-cls' + (UQ.cls === c ? " on" : "") + '" data-cls="' + esc(c) + '">' + esc(c) + '</button>';
        }).join("") : "") + '</div>';
      }
      if (UQ.step === 3) {
        body += '<div class="uq-sec"><span class="n">3</span>Subject — ' + esc(UQ.cls || "") + '</div>';
        body += '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><input class="f-in" id="uqSearch" placeholder="🔍 Search subjects…" value="' + esc(UQ.f) + '" style="flex:1;min-width:180px" />' +
          '<button class="btn sm ghost" id="uqCustomBtn">+ Add Subject</button></div>';
        body += '<div id="uqCustomBox"' + (UQ.customOpen ? "" : ' hidden') + ' style="margin-bottom:10px"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="f-in" id="uqCustomName" placeholder="Enter subject name" style="flex:1;min-width:180px" /><button class="btn sm" id="uqCustomAdd">Add</button></div></div>';
        body += '<div class="uq-grid" id="uqSubs"><div class="empty">Loading subjects…</div></div>';
      }
      if (UQ.step === 4) {
        body += '<div class="uq-sec"><span class="n">4</span>Question file — ' + esc(UQ.subj ? UQ.subj.name : "") + ' · ' + esc(UQ.cls || "") + '</div>';
        body += '<div class="uq-drop" id="uqDrop">☁️ <strong>Drag your question file here</strong> or <span style="color:var(--blue);font-weight:700">Browse files</span><br>' +
          '<span style="font-size:12px">Accepted formats: CSV, Excel, JSON, PDF, Word, TXT</span>' +
          (UQ.file ? '<br><span class="pill ok" style="margin-top:8px;display:inline-block">📄 ' + esc(UQ.file.name) + ' (' + Math.round(UQ.file.size / 1024) + ' KB)</span>' : '') + '</div>' +
          '<input type="file" id="uqFile" hidden accept=".csv,.xlsx,.xls,.json,.pdf,.docx,.doc,.txt" />';
        body += '<p class="mhint" id="uqGuide">CSV columns: <code>question_text,option_a,option_b,option_c,option_d,correct_option,topic,marks</code></p>';
        body += '<div style="margin-top:10px"><button class="btn ghost" id="uqManual">✍️ Write questions manually instead</button></div>';
      }
      if (UQ.step === 5) {
        body += reviewHtml();
      }
      body += '<div class="uq-nav"><button class="btn ghost" id="uqBack">' + (UQ.step === 1 ? "Cancel" : "← Back") + '</button>' +
        (UQ.step < 4 ? '<button class="btn" id="uqNext">Continue →</button>' :
          UQ.step === 4 ? '<button class="btn" id="uqPrev2">⬆ Preview questions</button>' :
          '<button class="btn" id="uqConfirm">⬆ Upload questions</button>') + '</div>';
      body += '<div class="merr" id="uqErr" style="display:none"></div>';
      openModal("☁️ Upload Questions", body, null, true);
      wire();
      if (UQ.step === 3) paintSubs();
      if (UQ.step === 5 && !UQ.pv && UQ.file && !UQ.done) runPreview();
    }
    function paintSubs() {
      var box = $("uqSubs"); if (!box) return;
      var f = (UQ.f || "").toLowerCase();
      var list = UQ.subs.filter(function (s) { return s.is_active !== false && (!f || s.name.toLowerCase().indexOf(f) >= 0); });
      box.innerHTML = list.length ? list.map(function (s) {
        return '<button class="uq-sub' + (UQ.subj && UQ.subj.id === s.id ? " on" : "") + '" data-sub="' + s.id + '" title="' + esc(s.name) + (s.scope === "school" ? " (your school)" : "") + '">' + esc(s.name) + (s.is_custom ? " ✎" : "") + '</button>';
      }).join("") : '<div class="empty">No subjects match. Use <strong>+ Add Subject</strong> to create it.</div>';
      Array.prototype.forEach.call(box.querySelectorAll("[data-sub]"), function (b) {
        b.addEventListener("click", function () {
          UQ.subj = UQ.subs.filter(function (s) { return s.id === b.getAttribute("data-sub"); })[0] || null;
          UQ.pv = null; UQ.file = null;
          UQ.step = 4; render();
        });
      });
    }
    function reviewHtml() {
      if (UQ.done) {
        return '<div class="panel" style="text-align:center;padding:26px"><div style="font-size:40px">✅</div>' +
          '<h3>' + UQ.done.inserted + ' questions saved</h3>' +
          '<p class="mhint">' + esc(UQ.done.bank_name || "") + ' · skipped ' + (UQ.done.skipped_duplicate || 0) + ' duplicate(s)' +
          ((UQ.done.skipped_invalid || []).length ? ' · <span style="color:#b45309">⚠ ' + UQ.done.skipped_invalid.length + ' row(s) skipped (no answer key or incomplete)</span>' : "") + '</p>' +
          '<div class="uq-nav" style="justify-content:center"><button class="btn ghost" onclick="closeModal()">Close</button>' +
          '<button class="btn" onclick="uploadQuestionsModal()">⬆ Upload another file</button></div></div>';
      }
      var pv = UQ.pv;
      if (!pv) return '<div class="empty">Parsing your file…</div>';
      var qs = pv.questions || [];
      var head = '<div class="uq-sec"><span class="n">5</span>Review — ' + esc(pv.subject ? pv.subject.name : "") + ' · ' + esc(pv.class_name || "") + '</div>';
      head += '<div class="stat-mini" style="margin-bottom:10px"><span class="chip">📄 ' + pv.total_questions + ' found</span>' +
        '<span class="chip g">✓ ' + pv.valid_count + ' valid</span>' +
        (pv.needs_review_count ? '<span class="chip y">⚠ ' + pv.needs_review_count + ' need review</span>' : '') +
        (pv.duplicate_in_bank ? '<span class="chip y">⧉ ' + pv.duplicate_in_bank + ' already in bank</span>' : '') + '</div>';
      if (pv.warnings && pv.warnings.length) head += '<p class="mhint">⚠ ' + pv.warnings.map(esc).join("; ") + '</p>';
      if (pv.format_guidance) head += '<p class="mhint">' + esc(pv.format_guidance) + '</p>';
      if (!qs.length) return head + '<div class="empty">No questions could be read from this file. Fix the format and try again.</div>';
      var rows = qs.map(function (q, i) {
        var flags = (q.issues || []).concat(q.in_bank_duplicate ? ["already in bank"] : [], q.in_file_duplicate ? ["duplicate in file"] : []);
        return '<tr><td>' + (i + 1) + '</td><td>' + esc((q.question_text || "").slice(0, 110)) + '<br>' +
          '<span style="color:#6b7280;font-size:11px">A. ' + esc(q.option_a || "—") + ' · B. ' + esc(q.option_b || "—") + ' · C. ' + esc(q.option_c || "—") + ' · D. ' + esc(q.option_d || "—") + '</span>' +
          (flags.length ? '<br><span class="uq-flag">⚠ ' + esc(flags.join("; ")) + '</span>' : '') + '</td>' +
          '<td><select data-r="' + i + '" data-ed="correct_option"><option value=""' + (q.correct_option ? "" : " selected") + '>—</option>' + ["A", "B", "C", "D"].map(function (o) {
            return '<option value="' + o + '"' + ((q.correct_option || "") === o ? " selected" : "") + '>' + o + '</option>';
          }).join("") + '</select></td>' +
          '<td><input data-r="' + i + '" data-ed="topic" value="' + esc(q.topic || "") + '" placeholder="Topic" /></td>' +
          '<td><input data-r="' + i + '" data-ed="marks" type="number" min="0" step="0.5" value="' + (q.marks != null ? q.marks : 1) + '" style="max-width:64px" /></td>' +
          '<td style="text-align:center"><input data-r="' + i + '" data-ed="skip" type="checkbox" title="Skip this row" /></td></tr>';
      }).join("");
      return head + '<div style="max-height:380px;overflow:auto"><table class="uq-table"><thead><tr><th>#</th><th>Question</th><th>Ans</th><th>Topic</th><th>Marks</th><th>Skip</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="mhint">Duplicates already in the bank are skipped automatically. Tick Skip to leave a row out.</p>';
    }
    function runPreview() {
      uqErr("");
      var box = document.querySelector("#mb .mb-body");
      if (box) box.innerHTML = stepper() + '<div class="empty">Parsing your file…</div>';
      var fd = new FormData();
      fd.append("file", UQ.file);
      fd.append("level", UQ.level); fd.append("class_name", UQ.cls); fd.append("subject_id", UQ.subj.id);
      cbtApi("/bank-uploads/preview", { method: "POST", form: fd }).then(function (pv) {
        UQ.pv = pv; render();
      }).catch(function (e) { UQ.pv = null; UQ.step = 4; render(); uqErr(errText(e)); });
    }
    function wire() {
      var back = $("uqBack");
      if (back) back.addEventListener("click", function () {
        if (UQ.step === 1) return closeModal();
        if (UQ.step === 5 && UQ.done) return closeModal();
        if (UQ.step === 3) { UQ.cls = null; }
        if (UQ.step === 4) { UQ.subj = null; }
        UQ.step = Math.max(1, UQ.step - 1); UQ.pv = null; render();
      });
      Array.prototype.forEach.call(document.querySelectorAll("#mb [data-lvl]"), function (el) {
        el.addEventListener("click", function () {
          UQ.level = el.getAttribute("data-lvl"); UQ.cls = null; UQ.subj = null; UQ.pv = null; UQ.file = null;
          UQ.step = 2; render();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll("#mb [data-cls]"), function (el) {
        el.addEventListener("click", function () {
          UQ.cls = el.getAttribute("data-cls"); UQ.subj = null; UQ.pv = null; UQ.file = null;
          UQ.step = 3;
          cbtApi("/subjects?level=" + encodeURIComponent(UQ.level) + "&class_name=" + encodeURIComponent(UQ.cls)).then(function (d) {
            UQ.subs = (d.subjects || []).filter(function (s) { return s.is_active !== false; }); render();
          }).catch(function (e) { UQ.subs = []; render(); uqErr(errText(e)); });
        });
      });
      var nx = $("uqNext");
      if (nx) nx.addEventListener("click", function () {
        if (UQ.step === 1 && !UQ.level) return uqErr("Pick a school level first.");
        if (UQ.step === 2 && !UQ.cls) return uqErr("Pick a class first.");
        if (UQ.step === 3 && !UQ.subj) return uqErr("Pick a subject first — or use + Add Subject.");
        UQ.step++; render();
      });
      var s = $("uqSearch");
      if (s) s.addEventListener("input", function () { UQ.f = s.value; paintSubs(); });
      var cb = $("uqCustomBtn");
      if (cb) cb.addEventListener("click", function () { UQ.customOpen = !UQ.customOpen; var x = $("uqCustomBox"); if (x) x.hidden = !UQ.customOpen; });
      var ca = $("uqCustomAdd");
      if (ca) ca.addEventListener("click", function () {
        var nm = ($("uqCustomName").value || "").trim();
        if (!nm) return uqErr("Type the subject name first.");
        busy(ca, true);
        cbtApi("/subjects", { method: "POST", body: { name: nm, level: UQ.level, class_names: [UQ.cls] } }).then(function (d) {
          busy(ca, false, "Add");
          var sub = d.subject;
          if (!UQ.subs.some(function (x) { return x.id === sub.id; })) UQ.subs.push(sub);
          UQ.subj = sub; UQ.f = ""; UQ.pv = null; UQ.file = null;
          toast(d.reused ? "Subject already existed — selected" : "Subject added");
          UQ.step = 4; render();
        }).catch(function (e) { busy(ca, false, "Add"); uqErr(errText(e)); });
      });
      var drop = $("uqDrop"), fi = $("uqFile");
      if (drop && fi) {
        drop.addEventListener("click", function () { fi.click(); });
        drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("over"); });
        drop.addEventListener("dragleave", function () { drop.classList.remove("over"); });
        drop.addEventListener("drop", function (e) {
          e.preventDefault(); drop.classList.remove("over");
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) { UQ.file = e.dataTransfer.files[0]; UQ.pv = null; render(); }
        });
        fi.addEventListener("change", function () { if (fi.files[0]) { UQ.file = fi.files[0]; UQ.pv = null; render(); } });
      }
      var pv2 = $("uqPrev2");
      if (pv2) pv2.addEventListener("click", function () {
        if (!UQ.file) return uqErr("Choose a question file first.");
        UQ.step = 5; UQ.pv = null; render();
      });
      var um = $("uqManual");
      if (um) um.addEventListener("click", function () {
        busy(um, true);
        cbtApi("/banks").then(function (d) {
          var found = (d.banks || []).filter(function (b) {
            return (b.subject || "").toLowerCase() === UQ.subj.name.toLowerCase() &&
              clsKey(b.class_name) === clsKey(UQ.cls);
          })[0];
          if (found) { closeModal(); addBankQ(found.id, ""); return; }
          cbtApi("/banks", { method: "POST", body: { name: UQ.subj.name + " " + UQ.cls + " Bank", subject: UQ.subj.name, class_name: UQ.cls } }).then(function (nb) {
            closeModal(); toast("Bank ready — type your questions"); addBankQ(nb.id, "");
          }).catch(function (e) { busy(um, false, "✍️ Write questions manually instead"); uqErr(errText(e)); });
        }).catch(function (e) { busy(um, false, "✍️ Write questions manually instead"); uqErr(errText(e)); });
      });
      var cf = $("uqConfirm");
      if (cf) cf.addEventListener("click", function () {
        if (!UQ.pv) return;
        var eds = {};
        Array.prototype.forEach.call(document.querySelectorAll('#mb [data-ed]'), function (el) {
          var r = el.getAttribute("data-r");
          eds[r] = eds[r] || {};
          var k = el.getAttribute("data-ed");
          eds[r][k] = el.type === "checkbox" ? el.checked : el.value;
        });
        var qs = [];
        var missing = 0;
        (UQ.pv.questions || []).forEach(function (q, i) {
          var ed = eds[String(i)] || {};
          if (ed.skip) return;
          // A row with no answer key must never be saved as "A" by accident.
          var co = String(ed.correct_option != null ? ed.correct_option : (q.correct_option || "")).trim();
          if (!co) missing++;
          qs.push({
            question_text: q.question_text, option_a: q.option_a, option_b: q.option_b,
            option_c: q.option_c, option_d: q.option_d, option_e: q.option_e || null,
            correct_option: co,
            topic: (ed.topic != null ? ed.topic : q.topic) || null,
            marks: ed.marks != null && ed.marks !== "" ? parseFloat(ed.marks) : (q.marks != null ? q.marks : 1),
            question_type: q.question_type || "multiple_choice", explanation: q.explanation || null
          });
        });
        if (!qs.length) return uqErr("Nothing to upload — untick Skip on at least one row.");
        if (missing) return uqErr(missing + " question(s) have no correct answer yet — pick A–D in the Ans column, or tick Skip to leave them out.");
        busy(cf, true);
        cbtApi("/bank-uploads/confirm", {
          method: "POST",
          body: { subject_id: UQ.subj.id, level: UQ.level, class_name: UQ.cls, questions: qs, import_mode: "skip_duplicates" }
        }).then(function (d) {
          UQ.done = d; render();
          try { renderExTab(); } catch (e) {}
        }).catch(function (e) { busy(cf, false, "⬆ Upload questions"); uqErr(errText(e)); });
      });
    }
    cbtApi("/subjects/meta").then(function (d) {
      UQ.levels = d.levels || []; render();
    }).catch(function (e) {
      openModal("☁️ Upload Questions", '<div class="empty">' + esc(errText(e)) + '</div>', '<button class="btn ghost" onclick="closeModal()">Close</button>', true);
    });
  };
  /* A bank is matched to an exam by its CLASS and SUBJECT, so both come from
     lists — typing "JSS2-SS3" or "CODING" made a bank no exam could find. */
  window.addBank = function () {
    openModal("New Question Bank",
      '<div class="mrow"><label class="f-label">Bank name (optional)</label><input class="f-in" id="bkName" placeholder="Defaults to Subject + Class" /></div>' +
      '<div class="form-grid"><div><label class="f-label">Class *</label><select class="f-in" id="bkClass"><option value="">Loading classes…</option></select></div>' +
      '<div><label class="f-label">Subject *</label><select class="f-in" id="bkSubject" disabled><option value="">Pick a class first</option></select></div></div>' +
      '<p class="mhint">One bank serves one class. These two choices decide which exams the questions feed, so pick them from the list.</p>' +
      '<div class="merr"></div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="bkSave">Create bank</button>');
    cbtApi("/subjects/meta").then(function (d) {
      var opts = ['<option value="">Choose class…</option>'];
      (d.levels || []).forEach(function (lvl) {
        (lvl.classes || []).forEach(function (c) {
          opts.push('<option value="' + esc(c) + '" data-lvl="' + esc(lvl.id) + '">' + esc(c) + '</option>');
        });
      });
      var pick = $("bkClass");
      if (pick) pick.innerHTML = opts.join("");
    }).catch(function (e) { mErr(errText(e)); });
    $("bkClass").addEventListener("change", function () {
      var chosen = this.options[this.selectedIndex];
      var lvl = chosen ? chosen.getAttribute("data-lvl") : "";
      var cls = this.value;
      var subjSel = $("bkSubject");
      if (!cls || !lvl) {
        subjSel.innerHTML = '<option value="">Pick a class first</option>';
        subjSel.disabled = true;
        return;
      }
      subjSel.disabled = true;
      subjSel.innerHTML = '<option value="">Loading subjects…</option>';
      cbtApi("/subjects?level=" + encodeURIComponent(lvl) + "&class_name=" + encodeURIComponent(cls)).then(function (d) {
        var subs = (d.subjects || []).filter(function (s) { return s.is_active !== false; });
        subjSel.innerHTML = '<option value="">Choose subject…</option>' + subs.map(function (s) {
          return '<option value="' + esc(s.name) + '">' + esc(s.name) + (s.scope === "school" ? " (your school)" : "") + '</option>';
        }).join("");
        subjSel.disabled = false;
      }).catch(function (e) { subjSel.innerHTML = '<option value="">Could not load subjects</option>'; mErr(errText(e)); });
    });
    $("bkSave").addEventListener("click", function () {
      var cls = $("bkClass").value, subj = $("bkSubject").value;
      if (!cls) return mErr("Choose the class this bank belongs to.");
      if (!subj) return mErr("Choose the subject this bank belongs to.");
      busy($("bkSave"), true);
      cbtApi("/banks", { method: "POST", body: {
        name: $("bkName").value.trim() || (subj + " " + cls + " Bank"),
        subject: subj, class_name: cls
      } })
        .then(function () { closeModal(); toast("Question bank created"); renderExTab(); })
        .catch(function (e) { busy($("bkSave"), false, "Create bank"); mErr(errText(e)); });
    });
  };
  window.delBank = function (id, name) {

  window.delBankPw = function (id, name) {

      busy(b, true);
      cbtApi("/banks/" + id, { method: "DELETE" }).then(function () { closeModal(); toast("Bank deleted"); bankList(); })

          '<td style="white-space:nowrap"><button class="btn sm ghost" onclick="editBankQ(\'' + id + '\',\'' + q.id + '\')">✏️ Edit</button> ' +
          '<button class="btn sm red" onclick="delBankQ(\'' + id + '\',\'' + q.id + '\')">Clear</button></td></tr>';
      });

        '<div style="max-height:420px;overflow:auto">' + tbl(["#", "Question", "Topic", "Difficulty", "Answer", ""], rows) + '</div>',
        '<button class="btn ghost" onclick="closeModal()">Close</button>' +
        '<button class="btn ghost" onclick="clearBankQs(\'' + id + '\',\'' + esc(d.bank.name).replace(/'/g, "") + '\')">🧹 Clear all</button>' +
        '<button class="btn" onclick="closeModal();addBankQ(\'' + id + '\',\'\')">➕ Add questions</button>', true);

  /* Password gate — deletes/clears require the staff member's LOGIN password.
     Edit only asks "are you sure". */

      '<div class="mrow"><label class="f-label">Login password *</label><input class="f-in" id="pwGate" type="password" autocomplete="current-password" /></div><div class="merr"></div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn red" id="pwGo">' + esc(actionLabel) + '</button>', true);

  /* Clearing a question or a whole bank needs the admin PIN (asked once, by the

  /* ═══ CONFIRM REGISTRATION HUB — every registered student, per class ═══
     Filter bar (class / subject / search / status chips), subjects per
     student under their name, approve one / all, restrict one / all,
     edit info, delete one / all, CSV export, printable reg slips. */
  window.__regAll = [];
  window.__regSel = {};
  window.__regF = { cls: "", subj: "", q: "", status: "all" };
  window.__regPool = { classes: [], subjects: [] };
  function regSelIds() { return Object.keys(window.__regSel).filter(function (k) { return window.__regSel[k]; }); }
  function regById(id) { return (window.__regAll || []).filter(function (s) { return s.student_id === id; })[0]; }
  function regVisibleIds() {
    var st = window.__regF.status;
    return (window.__regAll || []).filter(function (s) { return st === "all" || (s.status || "pending") === st; }).map(function (s) { return s.student_id; });
  }
  function regPoolUpdate(list) {
    list.forEach(function (s) {
      if (s.class_name && window.__regPool.classes.indexOf(s.class_name) < 0) window.__regPool.classes.push(s.class_name);
      (s.subjects || []).forEach(function (x) { if (x && window.__regPool.subjects.indexOf(x) < 0) window.__regPool.subjects.push(x); });
    });
    window.__regPool.classes.sort();
    window.__regPool.subjects.sort();
  }
  function confirmList() {
    window.__regF = { cls: "", subj: "", q: "", status: "all" };
    window.__regSel = {};
    $("exBody").innerHTML =
      '<div class="panel"><div class="form-grid">' +
      '<div><label class="f-label">Class</label><select class="f-in" id="rgCls" onchange="regApply()"><option value="">All Classes</option></select></div>' +
      '<div><label class="f-label">Subject</label><select class="f-in" id="rgSubj" onchange="regApply()"><option value="">All Subjects</option></select></div></div>' +
      '<div class="form-grid"><div><label class="f-label">Search</label><input class="f-in" id="rgQ" placeholder="Name, reg number or email…" oninput="regDebounce()" /></div>' +
      '<div><label class="f-label">&nbsp;</label><div class="radio-row"><button class="btn sm" onclick="regFetch()">🔍 Apply</button><button class="btn sm ghost" onclick="regClear()">Clear</button></div></div></div>' +
      '<div class="radio-row" id="rgChips" style="flex-wrap:wrap"></div>' +
      '<div class="radio-row" id="rgBulk" style="flex-wrap:wrap"></div>' +
      '<div id="rgBody"><div class="empty">Loading registered students…</div></div></div>';
    regFetch();
  }
  window.regFetch = function () {
    var f = window.__regF;
    var p = ["status=all"];
    if (f.cls) p.push("class_name=" + encodeURIComponent(f.cls));
    if (f.subj) p.push("subject=" + encodeURIComponent(f.subj));
    if (f.q) p.push("q=" + encodeURIComponent(f.q));
    var box = $("rgBody");
    if (box) box.innerHTML = '<div class="empty">Loading…</div>';
    cbtApi("/registrations?" + p.join("&")).then(function (d) {
      window.__regAll = d.students || [];
      window.__regCounts = d.counts || {};
      regPoolUpdate(window.__regAll);
      regRender();
    }).catch(function (e) { if (box) box.innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };
  window.regApply = function () {
    window.__regF.cls = $("rgCls") ? $("rgCls").value : "";
    window.__regF.subj = $("rgSubj") ? $("rgSubj").value : "";
    window.__regF.q = ($("rgQ") && $("rgQ").value.trim()) || "";
    window.__regSel = {};
    regFetch();
  };
  window.regDebounce = function () { clearTimeout(window.__regT); window.__regT = setTimeout(regApply, 450); };
  window.regClear = function () {
    window.__regF = { cls: "", subj: "", q: "", status: "all" };
    window.__regSel = {};
    regFetch();
  };
  window.regChip = function (st) { window.__regF.status = st; regRender(); };
  window.regToggle = function (id) { window.__regSel[id] = !window.__regSel[id]; regRender(); };
  window.regSelectAll = function () {
    var vis = regVisibleIds();
    var any = vis.some(function (id) { return !window.__regSel[id]; });
    vis.forEach(function (id) { window.__regSel[id] = any; });
    regRender();
  };
  function regRefresh() { regFetch(); }

  function regPills(arr) {
    return (arr || []).map(function (x) { return '<span class="pill blue" style="display:inline-block;margin:2px 4px 0 0">' + esc(x) + '</span>'; }).join("") || '<span class="muted">—</span>';
  }
  function regStatusPill(st) {
    if (st === "approved") return '<span class="pill ok">Approved</span>';
    if (st === "restricted") return '<span class="pill bad">Restricted</span>';
    return '<span class="pill warn">Pending</span>';
  }
  function regRow(s) {
    var id = s.student_id, st = (s.status || "pending").toLowerCase();
    var subs = (s.subjects && s.subjects.length) ? s.subjects
      : (s.requested_subjects || []).filter(function (x) { return String(x).toUpperCase() !== "ALL"; });
    var name = '<strong>' + esc(s.full_name) + '</strong>' +
      (s.email ? '<div class="muted" style="font-size:12px">' + esc(s.email) + '</div>' : "") +
      '<div style="margin-top:4px">' + regPills(subs) + '</div>';
    var acts = "";
    if (st === "pending") acts += '<button class="btn sm" onclick="regApprove(\'' + id + '\',this)">✅ Approve</button> ';
    else acts += '<button class="btn sm ' + (st === "restricted" ? "" : "ghost") + '" onclick="regRestrictOne(\'' + id + '\',' + (st === "restricted" ? "false" : "true") + ',this)">' + (st === "restricted" ? "🔓 Unrestrict" : "🚫 Restrict") + '</button> ';
    acts += '<button class="btn sm ghost" onclick="regEdit(\'' + id + '\')" title="Edit info">✏️</button> ' +
      '<button class="btn sm red" onclick="regDeleteOne(\'' + id + '\')" title="Delete">🗑</button>' +
      (s.reg_number ? ' <button class="btn sm ghost" onclick="regSlip(\'' + id + '\')" title="Print registration slip">🖨</button>' : "");
    return '<tr><td><input type="checkbox" ' + (window.__regSel[id] ? "checked" : "") + ' onchange="regToggle(\'' + id + '\')" /></td>' +
      '<td><code>' + esc(s.reg_number || "—") + '</code></td>' +
      '<td>' + name + '</td>' +
      '<td>' + esc(s.class_name || "—") + '</td>' +
      '<td><code>' + esc(s.access_code || "—") + '</code></td>' +
      '<td>' + regStatusPill(st) + '</td>' +
      '<td style="white-space:nowrap">' + acts + '</td></tr>';
  }
  window.regRender = function () {
    var f = window.__regF, c = window.__regCounts || {};
    var cls = $("rgCls"), subj = $("rgSubj");
    if (cls) {
      cls.innerHTML = '<option value="">All Classes</option>' + window.__regPool.classes.map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join("");
      cls.value = f.cls; if (cls.value !== f.cls) { cls.value = ""; window.__regF.cls = ""; }
    }
    if (subj) {
      subj.innerHTML = '<option value="">All Subjects</option>' + window.__regPool.subjects.map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join("");
      subj.value = f.subj; if (subj.value !== f.subj) { subj.value = ""; window.__regF.subj = ""; }

    var chips = [["all", "All", c.all], ["pending", "🟡 Pending", c.pending], ["approved", "🟢 Approved", c.approved], ["restricted", "🔴 Restricted", c.restricted]];
    var ch = $("rgChips");
    if (ch) ch.innerHTML = chips.map(function (x) {
      return '<button class="btn sm ' + (f.status === x[0] ? "" : "ghost") + '" onclick="regChip(\'' + x[0] + '\")">' + x[1] + ' <span class="pill gray">' + (x[2] != null ? x[2] : 0) + '</span></button>';
    }).join("");
    var n = regSelIds().length;
    var bk = $("rgBulk");
    if (bk) bk.innerHTML =
      '<button class="btn sm" onclick="regApproveAll(this)">✅ Approve All' + (f.cls ? " · " + esc(f.cls) : "") + '</button>' +
      '<button class="btn sm ghost" onclick="regBulkRestrict(true)">🚫 Restrict' + (n ? " (" + n + ")" : "") + '</button>' +
      '<button class="btn sm ghost" onclick="regBulkRestrict(false)">🔓 Unrestrict' + (n ? " (" + n + ")" : "") + '</button>' +
      '<button class="btn sm red" onclick="regBulkDelete()">🗑 Delete' + (n ? " (" + n + ")" : "") + '</button>' +
      '<button class="btn sm ghost" onclick="regExport(this)">⬇ Export CSV</button>' +
      '<button class="btn sm ghost" onclick="regPrintAll()">🖨 Print All' + (n ? " (" + n + ")" : "") + '</button>' +
      '<button class="btn sm ghost" onclick="regSelectAll()">☑ Select all</button>';
    function sec(title, st) {
      var rows = (window.__regAll || []).filter(function (s) { return (s.status || "pending").toLowerCase() === st; }).map(regRow);
      return '<div class="panel" style="margin-top:14px"><h3>' + title + ' <span class="pill gray">' + rows.length + '</span></h3>' +
        (rows.length ? '<div style="overflow-x:auto"><table><thead><tr><th></th><th>Reg Number</th><th>Student &amp; Subjects</th><th>Class</th><th>Access Code</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + rows.join("") + '</tbody></table></div>' : '<div class="empty">None here.</div>') + '</div>';

    if (f.status === "all" || f.status === "pending") parts.push(sec("🟡 Pending Approvals", "pending"));
    if (f.status === "all" || f.status === "restricted") parts.push(sec("🔴 Restricted Students", "restricted"));

  function printViaIframe(docHtml) {
    var f = document.createElement("iframe");
    f.setAttribute("aria-hidden", "true");
    f.style.cssText = "position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;";
    document.body.appendChild(f);
    var d = f.contentWindow.document;
    d.open(); d.write(docHtml); d.close();
    var fired = false;
    var go = function () {
      if (fired) return; fired = true;
      try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) {}
      setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 60000);
    };
    var imgs = d.images || [], left = imgs.length;
    if (!left) { setTimeout(go, 300); return; }
    Array.prototype.forEach.call(imgs, function (im) {
      if (im.complete) { left--; return; }
      im.addEventListener("load", function () { left--; if (left <= 0) go(); });
      im.addEventListener("error", function () { left--; if (left <= 0) go(); });
    });
    if (left <= 0) { setTimeout(go, 300); return; }
    setTimeout(go, 3000);

      return parts[0].split(",").map(function (s) { s = s.trim(); return s === "body" ? scope : scope + " " + s; }).join(",") + "{" + parts[1] + "}";
    }).join("");
  }

  window.upSaveSheet = function (status) {

  window.loadAttendance = function (date) {

  window.paintAttendance = function () {
    var list = window.__attAll || [];
    var cls = ($("attCls") && $("attCls").value) || "";
    var q = (($("attQ") && $("attQ").value) || "").trim().toLowerCase();
    var s = { total: list.length, present: 0, absent: 0, late: 0 };
    list.forEach(function (st) {
      var k = st.key || st.student_id;
      // Keep marks already made in this visit; only fill in the saved ones.
      if (!(k in window.__attMarks)) window.__attMarks[k] = st.status;
      var v = window.__attMarks[k];
      if (v === "present") s.present++;
      else if (v === "absent") s.absent++;
      else if (v === "late") s.late++;
    });
    $("attSum").innerHTML = '<span class="chip">All students: ' + s.total + '</span><span class="chip g">Present: ' + s.present + '</span><span class="chip r">Absent: ' + s.absent + '</span><span class="chip w">Late: ' + s.late + '</span><span class="chip">' + esc(window.__attDate || "") + '</span>';
    var shown = list.filter(function (st) {
      if (cls && st.class_name !== cls) return false;
      if (q && (st.full_name || "").toLowerCase().indexOf(q) < 0 && (st.student_id || "").toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var rows = shown.map(function (st) {
      var k = (st.key || st.student_id);
      var cur = window.__attMarks[k] || st.status;
      var opts = ["unmarked", "present", "absent", "late"].map(function (v) {
        return '<option value="' + v + '"' + (cur === v ? " selected" : "") + '>' + (v === "unmarked" ? "Not marked" : v.charAt(0).toUpperCase() + v.slice(1)) + '</option>';

    });
    $("attTbl").innerHTML = rows.length
      ? tbl(["Student", "Student ID", "Class", "Status"], rows)
      : (list.length
        ? '<div class="empty">No student matches that class or search.</div>'
        : '<div class="empty">No students in this school yet. <button class="btn sm" onclick="showPage(\'students\')">Go to Students</button></div>');
  };
