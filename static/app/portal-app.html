  R.settings = function () {
    $("pages").innerHTML = head("Settings", "Your school details and the admin PIN that protects every change.") + '<div class="panel" id="setBody"><div class="empty">Loading…</div></div>';
    api("/settings").then(function (d) {
      var s = d.school || {};
      var scholaxiaUrl = s.slug ? "https://" + s.slug + ".scholaxia.com/" : "";
      var customUrl = d.custom_domain ? "https://" + d.custom_domain + "/" : "";
      $("setBody").innerHTML =
        '<div class="form-grid">' +
        '<div><label class="f-label">School name</label><input class="f-in" value="' + esc(s.name) + '" disabled /></div>' +
        '<div><label class="f-label">Your Scholaxia school link</label><input class="f-in" value="' + esc(scholaxiaUrl) + '" disabled /></div>' +
        '<div><label class="f-label">Optional custom domain</label><input class="f-in" value="' + esc(customUrl || "Not set — ask the Scholaxia team to host and connect your domain") + '" disabled /></div>' +
        '<div><label class="f-label">Type</label><input class="f-in" value="' + esc((s.school_type || "—") + (s.category && s.category !== "mixed" ? " · " + s.category + " only" : " · Mixed")) + '" disabled /></div>' +
        '<div><label class="f-label">Location</label><input class="f-in" value="' + esc([s.city, s.state].filter(Boolean).join(", ") || "—") + '" disabled /></div>' +
        '<div><label class="f-label">Contact email</label><input class="f-in" id="setEmail" value="' + esc(s.contact_email || "") + '" /></div>' +
        '<div><label class="f-label">Contact phone</label><input class="f-in" id="setPhone" value="' + esc(s.contact_phone || "") + '" /></div>' +
        '<div class="full"><label class="f-label">Address</label><input class="f-in" id="setAddr" value="' + esc(s.address || "") + '" /></div>' +
        '</div><button class="btn" onclick="saveSettings(this)">💾 Save changes</button>' +
        '<p class="muted" style="margin-top:12px">Both links open this same school portal. Your Scholaxia link is ready by default; a custom domain can be connected later by the Scholaxia team.</p>' +
        '<div class="panel" style="margin-top:18px"><h3>🔐 Admin PIN</h3>' +
        '<p class="mhint">The 6-digit PIN asked before this control panel opens. Teachers never see it.</p>' +
        '<div id="pinPanelBody" class="muted" style="margin-top:10px">Loading…</div></div>' +
        '<div class="panel" style="margin-top:18px"><h3>🔒 What teachers can open</h3>' +
        '<p class="mhint">These are the sections of this portal. Switch one off and your teachers see a padlock and “Ask your school admin for access” instead of the page. You can unlock it any time.</p>' +
        '<div id="tLocksBody" class="muted" style="margin-top:10px">Loading…</div></div>';
      loadPinPanel();
      loadTeacherLocks();
    }).catch(function (e) { $("setBody").innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  };
  function loadPinPanel() {
    var box = $("pinPanelBody");
    if (!box) return;
    if (String((S.user && S.user.role) || "").toLowerCase() === "teacher") {
      box.innerHTML = '<span class="pill gray">Admin only</span> <span class="mhint">Only the school admin can create or change the PIN.</span>';
      return;
    }
    settingsApi("/pin").then(function (d) {
      box.innerHTML = d && d.has_pin
        ? '<span class="pill ok">PIN is set</span> <button class="btn sm ghost" onclick="pinChange()">Change PIN</button>'
        : '<span class="pill warn">No PIN yet</span> <button class="btn sm" onclick="pinCreate()">Create 6-digit PIN</button>';
    }).catch(function (e) { box.textContent = errText(e); });
  }
  function loadTeacherLocks() {
    var box = $("tLocksBody");
    if (!box) return;
    settingsApi("/features").then(function (d) {
      var rows = (d.features || []).map(function (f) {
        return '<tr><td><strong>' + esc(f.label) + '</strong><div class="muted" style="font-size:12px">' + esc(f.description) + '</div></td>' +
          '<td>' + (f.locked ? '<span class="pill bad">Locked</span>' : '<span class="pill ok">Open</span>') + '</td>' +
          '<td style="white-space:nowrap"><button class="btn sm ' + (f.locked ? "" : "ghost") + '" onclick="toggleTeacherFeature(\'' + esc(f.key) + '\',' + (f.locked ? 'false' : 'true') + ',this)">' + (f.locked ? '🔓 Unlock' : '🔒 Lock') + '</button></td></tr>';
      });
      box.className = "";
      box.innerHTML = (d.locked_count ? '<p class="mhint">' + d.locked_count + ' section' + (d.locked_count === 1 ? '' : 's') + ' closed to teachers.</p>' : '') + tbl(["Portal section", "For teachers", ""], rows);
    }).catch(function (e) { box.innerHTML = '<div class="empty">' + esc(errText(e)) + '</div>'; });
  }
  window.toggleTeacherFeature = function (key, locked, btn) {
    busy(btn, true);
    settingsApi("/features", { method: "PUT", body: { key: key, locked: !!locked } }).then(function () {
      toast(locked ? "Locked for teachers" : "Unlocked for teachers");
      loadTeacherLocks();
    }).catch(function (e) { busy(btn, false); toastErr(e); });
  };
  window.saveSettings = function (btn) {
    busy(btn, true);
    api("/settings", { method: "PATCH", body: { address: $("setAddr").value, contact_email: $("setEmail").value, contact_phone: $("setPhone").value } })
      .then(function () { busy(btn, false, "💾 Save changes"); toast("Settings saved"); })
      .catch(function (e) { busy(btn, false, "💾 Save changes"); toastErr(e); });
  };

  /* ── BOOT ── */
  initLogin();
})();
</script>
</body>
</html>
