<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- YouTube's embedded player needs a Referer that identifies the embedder.
       Loading the player inside this https page (instead of navigating straight
       to youtube.com/embed/...) fixes "Error 153 - video player configuration
       error" in the Scholaxia app WebView. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Scholaxia - Lesson video</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .msg {
      color: #94a3b8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
      if (!id) {
        document.body.innerHTML = '<p class="msg">No video selected.</p>';
        return;
      }
      var frame = document.createElement('iframe');
      frame.src =
        'https://www.youtube-nocookie.com/embed/' + id +
        '?rel=0&playsinline=1&modestbranding=1&iv_load_policy=3';
      frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      frame.setAttribute('allow',
        'accelerometer; autoplay; clipboard-write; encrypted-media; ' +
        'gyroscope; picture-in-picture; web-share');
      frame.setAttribute('allowfullscreen', '');
      document.body.appendChild(frame);
    })();
  </script>
</body>
</html>
